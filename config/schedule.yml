import_market_data:
  cron: "0 22 * * 1-5" # 5:00 PM EST / 6:00 PM EDT (NY time) Monday through Friday
  class: "ImportMarketDataJob"
  queue: "scheduled"
  description: "Imports market data daily at 5:00 PM EST (1 hour after market close)"
  args:
    mode: "full"
    clear_cache: false
  
clean_syncs:
  cron: "0 * * * *" # every hour
  class: "SyncCleanerJob"
  queue: "scheduled"
  description: "Cleans up stale syncs and reaps imports, exports, and provider fetch flags stuck by lost jobs"

process_financekit_inbox:
  cron: "*/5 * * * *"
  class: "FinancekitInboxJob"
  queue: "high_priority"
  description: "Applies durable FinanceKit publisher batches and retries downstream work"

refresh_security_fundamentals:
  cron: "30 22 * * 1-5" # 30 minutes after the market-data import, Monday through Friday
  class: "SecurityFundamentalsRefreshJob"
  queue: "scheduled"
  description: "Caches stock data (valuation, analyst view, earnings date) for held securities"

refresh_security_research_universe:
  cron: "45 1-20 * * 1-5" # hourly on weekdays, clear of the 22:30-23:10 held-securities jobs; each run is capped and stops at the first rate limit
  class: "SecurityResearchUniverseRefreshJob"
  queue: "scheduled"
  description: "Seeds research pages for every known ticker and caches their stock data, held or not"

refresh_security_research:
  cron: "0 23 * * 1-5" # after the Invest research artifacts finish their daily refresh
  class: "SecurityResearchSnapshotsImportJob"
  queue: "scheduled"
  description: "Imports read-only ticker research (Quiver, Finviz, news, notes and reports)"

refresh_security_headline_analysis:
  cron: "10 23 * * 1-5"
  class: "SecurityHeadlineAnalysesRefreshJob"
  queue: "scheduled"
  description: "Runs bounded Jev headline-tone analysis over changed imported research snapshots"

run_security_health_checks:
  cron: "0 2 * * 1-5" # 2:00 AM EST / 3:00 AM EDT (NY time) Monday through Friday
  class: "SecurityHealthCheckJob"
  queue: "scheduled"
  description: "Runs security health checks to detect issues with security data"

sync_hourly:
  cron: "0 * * * *" # every hour at the top of the hour
  class: "SyncHourlyJob"
  queue: "scheduled"
  description: "Syncs provider items that opt-in to hourly syncing"

sync_property_valuations:
  cron: "30 1 1 * *" # monthly on the 1st at 1:30 AM
  class: "SyncPropertyValuationsJob"
  queue: "scheduled"
  description: "Refreshes AVM property valuations once a month (providers enforce tight monthly request caps)"

clean_data:
  cron: "0 3 * * *" # daily at 3:00 AM
  class: "DataCleanerJob"
  queue: "scheduled"
  description: "Cleans up old data (e.g., expired merchant associations, expired archived exports)"

clean_debug_log_entries:
  cron: "30 3 * * *" # daily at 3:30 AM
  class: "DebugLogCleanupJob"
  queue: "scheduled"
  description: "Deletes debug log entries older than 90 days"

clean_inactive_families:
  cron: "0 4 * * *" # daily at 4:00 AM
  class: "InactiveFamilyCleanerJob"
  queue: "scheduled"
  description: "Archives and destroys families that expired their trial without subscribing (managed mode only)"

refresh_demo_family:
  cron: "0 5 * * *" # daily at 5:00 AM UTC
  class: "DemoFamilyRefreshJob"
  queue: "scheduled"
  description: "Refreshes demo family data and emails super admins with daily usage summary"

generate_recurring_occurrences:
  cron: "30 5 * * *" # daily at 5:30 AM UTC, before insights so generators see fresh occurrences
  class: "GenerateRecurringOccurrencesJob"
  queue: "scheduled"
  description: "Materializes the rolling window of recurring-transaction occurrences for every family"

generate_insights:
  cron: "0 6 * * *" # daily at 6:00 AM UTC, after the nightly cleanup jobs
  class: "GenerateInsightsJob"
  queue: "scheduled"
  description: "Generates proactive financial insights for families with preview features enabled"

sweep_expired_goal_pledges:
  cron: "*/15 * * * *" # every 15 minutes
  class: "SweepExpiredGoalPledgesJob"
  queue: "scheduled"
  description: "Marks goal pledges that passed their 7-day window as expired"

refresh_maintained_goal_targets:
  cron: "0 3 1 * *" # 3:00 AM on the 1st of each month
  class: "RefreshMaintainedGoalTargetsJob"
  queue: "scheduled"
  description: "Recomputes the floor of reserves expressed in months of expenses"

expire_research_watchlist:
  cron: "20 4 * * *" # daily; lapsed assistant-added entries are already hidden, this frees the rows
  class: "ResearchWatchlistExpiryJob"
  queue: "scheduled"
  description: "Removes AI-assistant-added research watchlist entries past their expiry"

discover_investment_watchlist_candidates:
  cron: "30 23 * * 1-5" # after the nightly fundamentals (22:30), research import (23:00) and headline analysis (23:10), so it only ever sees that day's data
  class: "InvestmentWatchlistDiscoveryJob"
  queue: "scheduled"
  description: "Queues at most one fresh, evidence-gated research candidate daily for members who opted in"

refresh_security_intraday_prices:
  cron: "*/20 13-20 * * 1-5" # every 20 minutes UTC through the US session (9:30-16:15 ET); the job itself checks the clock
  class: "SecurityIntradayPricesRefreshJob"
  queue: "scheduled"
  description: "Refreshes today's provisional price of held securities during market hours so day gain is live"

refresh_option_quotes:
  cron: "*/30 13-20 * * 1-5" # UTC grid covering 9:30-16:00 ET in both daylight and standard time; the job's calendar guard decides whether a firing runs
  class: "OptionQuotesRefreshJob"
  queue: "scheduled"
  description: "Caches market quotes for held option contracts and the sell-put / covered-call idea chains during the session"

refresh_option_quotes_settle_edt:
  cron: "20 20 * * 1-5" # 16:20 ET in daylight time; the guard skips it in standard time. Never 22:00-22:35 UTC (fundamentals refresh)
  class: "OptionQuotesRefreshJob"
  queue: "scheduled"
  description: "Final option quote refresh after the close (daylight time) so the next session's day change has a settled baseline"

refresh_option_quotes_settle_est:
  cron: "20 21 * * 1-5" # 16:20 ET in standard time; the guard skips it in daylight time
  class: "OptionQuotesRefreshJob"
  queue: "scheduled"
  description: "Final option quote refresh after the close (standard time) so the next session's day change has a settled baseline"
